name: lint

on:
  push:
    branches: ["main"]
  pull_request:

env:
  # Each Linux job runs in its own container with its own ~/.m2 and Windows
  # jobs are capacity 1, so exactly one process ever touches the local
  # repository. Aether's cross-process locking therefore protects nothing and
  # can only fail, as it did in #28.
  CLJ_JVM_OPTS: "-Daether.syncContext.named.factory=noop"

jobs:
  lint:
    # One runner: neither tool is platform-dependent. Platform coverage belongs
    # to the test workflow (TECHNICAL.md §9, §10.2).
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        # Full URL: this Forgejo does not resolve third-party actions from
        # github.com by default. Only actions/checkout works bare.
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT DeLaGuardo/setup-clojure: it authenticates to api.github.com with
        # the job's GITHUB_TOKEN - a Forgejo token here - and 401s even for a
        # pinned version. The official installer involves no GitHub at all.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Formatting
        # `clojure -M:cljfmt fix src dev test build.clj` resolves failures locally.
        run: clojure -M:cljfmt check src dev test build.clj

      - name: Linting
        run: clojure -M:clj-kondo --lint src --lint dev --lint test --lint build.clj
