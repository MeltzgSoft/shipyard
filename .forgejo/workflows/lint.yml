name: lint

on:
  push:
    branches: ["main"]
  pull_request:

# Every job runs `clojure`, which takes a write lock on the shared ~/.m2 on this
# runner. Concurrent workflows collide:
#
#   IllegalStateException: Could not acquire write lock for 'artifact:...'
#
# One group across ALL Shipyard workflows, so runs queue instead of racing. That
# serialises CI, which is the right trade at this repo's traffic - a stacked set
# of pull requests otherwise pushes several branches at once and fails on
# infrastructure rather than on code.
#
# cancel-in-progress stays false: a superseded run holding the lock should finish
# and release it rather than being killed mid-resolve.
concurrency:
  group: shipyard-ci
  cancel-in-progress: false

jobs:
  lint:
    # One runner: neither tool is platform-dependent. Platform coverage belongs
    # to the test workflow (TECHNICAL.md §9, §10.2).
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        # Full URL: this Forgejo does not resolve third-party actions from
        # github.com by default. Only actions/checkout works bare.
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT DeLaGuardo/setup-clojure: it authenticates to api.github.com with
        # the job's GITHUB_TOKEN - a Forgejo token here - and 401s even for a
        # pinned version. The official installer involves no GitHub at all.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Formatting
        # `clojure -M:cljfmt fix src test build.clj` resolves failures locally.
        run: clojure -M:cljfmt check src test build.clj

      - name: Linting
        run: clojure -M:clj-kondo --lint src --lint test --lint build.clj
