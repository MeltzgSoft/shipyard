name: test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  # Each Linux job runs in its own container with its own ~/.m2. The Windows
  # and macOS runners are host mode capacity 1, so exactly one process on each
  # host ever touches its local repository. Aether's cross-process locking
  # therefore protects nothing and can only fail, as it did in #28.
  CLJ_JVM_OPTS: "-Daether.syncContext.named.factory=noop"

  # NO actions/cache for ~/.m2 here, deliberately. It was tried and does not
  # work on this forge: the runner serves its actions cache on a random port
  # (observed 46245), so every restore dies with
  #   Failed to restore: getCacheEntry failed: connect EHOSTUNREACH
  # usb-ci/unraid/runner/config.yml documents this exact symptom and pins the
  # port to 38009 for it; the runner backing this repo is not running that
  # setting. Until it does, a cache step buys nothing and warns on every run.
  #
  # Cost of going without: each Linux job downloads ~182 artifacts cold.
  # The host-mode Windows and macOS runners keep ~/.m2 between jobs and are
  # unaffected after their first download.

jobs:
  test-linux:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        # Java 25, not 21: the :test alias passes
        # --sun-misc-unsafe-memory-access, which does not exist before JDK 23
        # and makes an older JVM refuse to start rather than ignore it.
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: clojure -M:test:natives-linux --focus :unit

      - name: Integration tests
        run: clojure -M:test:natives-linux --focus :integration

  test-windows:
    # Windows earns its slot on integration, not compilation: path separators,
    # file locking and Files.move atomicity, which the mesh cache depends on
    # (TECHNICAL.md §9). The natives are prebuilt jars, so this job is never
    # needed to build or release.
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT win-install.ps1, and NOT setup-clojure. The official Windows
        # installer is INTERACTIVE - it calls Read-Host - so it hangs or fails
        # in a runner. Install the same clojure-tools.zip the installer would
        # have expanded, into a user module path already on PSModulePath, so
        # later pwsh steps auto-load it. Anonymous download, no prompt, no admin.
        shell: pwsh
        run: |
          $ver = '1.12.4.1618'
          Invoke-WebRequest "https://github.com/clojure/brew-install/releases/download/$ver/clojure-tools.zip" -OutFile clojure-tools.zip
          $dest = Join-Path $HOME 'Documents\PowerShell\Modules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive clojure-tools.zip -DestinationPath $dest -Force
          Remove-Item clojure-tools.zip
          Import-Module ClojureTools
          clojure -Sdescribe

      - name: Unit tests
        shell: pwsh
        run: clojure -M:test:natives-windows --focus :unit

      - name: Integration tests
        shell: pwsh
        run: clojure -M:test:natives-windows --focus :integration

  test-macos:
    # Apple Silicon earns its slot for the same reason as Windows: execute the
    # mesh pipeline and filesystem tests against the actual platform natives,
    # not merely resolve their prebuilt jars elsewhere. Host mode, capacity 1.
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Check the provisioned Clojure CLI
        run: clojure -Sdescribe

      - name: Unit tests
        run: clojure -M:test:natives-macos-arm64 --focus :unit

      - name: Integration tests
        run: clojure -M:test:natives-macos-arm64 --focus :integration

  test-cljs:
    # The cljc tests again, on the browser runtime. A JVM-only pass proves the
    # encoder agrees with itself; this is what proves encoder and decoder agree
    # on the binary layout (TECHNICAL.md §10.1).
    #
    # Linux only: this tests a runtime, not a platform.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm ci

      - name: Run cljc tests on the browser runtime
        run: |
          npx shadow-cljs compile test
          node target/js/node-tests.js

  readme:
    # Run what README's Development section tells a person to run.
    #
    # Nothing else does. The workflows spell every command correctly, which is
    # why CI stayed green through #37 and #39 while the README told people to
    # run commands that did not work - two lists that must agree, and only one
    # of them executed. This job executes the other one, extracting the commands
    # from the file rather than restating them here, because restating them is
    # the bug.
    #
    # Linux only: it checks that the documentation is true, not that the code is
    # portable. The natives alias it exercises is spelled per platform, and the
    # README says so.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      # `npm ci` only - deliberately not the htmx copy. That copy is a step the
      # README is responsible for telling you about, and #37 was it failing to.
      - name: Install npm dependencies
        run: npm ci

      - name: Run README's own Development commands
        run: .forgejo/scripts/check-readme-commands.sh

  test-e2e:
    # The browser level (TECHNICAL.md §10.3). Linux only, deliberately: it tests
    # application behaviour, not platform behaviour, and it is the slowest job
    # here - Windows would buy nothing and cost the §9 ten-minute budget.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      # Playwright ships the browser it drives, versioned with the library, so
      # this replaces a Chrome-for-Testing version lookup and two zip downloads
      # matched by hand (issue #49). `--with-deps` installs the shared libraries
      # Chromium needs, which was the other half of that block.
      - name: Playwright's browser
        run: java -cp "$(clojure -Spath -M:test)" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Install npm dependencies
        run: npm ci

      - name: Build the front-end assets
        # The dev build, not the release one: only it defines
        # window.__shipyard.stats(), which every scene assertion reads.
        #
        # And htmx, which `clojure -T:build uber` copies but no test task does.
        # Without it the page renders, the canvas is there, and nothing ever
        # loads the library - every test times out on an element that was never
        # going to appear, which reads exactly like a server bug and is not one.
        run: |
          npx shadow-cljs compile viewport
          cp node_modules/htmx.org/dist/htmx.min.js resources/public/js/

      - name: E2E tests
        run: clojure -M:test:natives-linux --focus :e2e

  package:
    # The release artifact, and the only job that proves one exists. Linux
    # alone: the natives are prebuilt jars, so this packages all four
    # classifiers (TECHNICAL.md §9).
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Build the uberjar
        # This also asserts the E2E introspection hook is absent from the
        # release bundle (issue #16) - build.clj greps for it and throws.
        run: clojure -T:build uber

      - name: The jar does the whole job, the way a user runs it
        # Not a liveness ping. This walks the real path - scan, catalog,
        # preprocess through LWJGL, serve the mesh - so it covers three things
        # nothing else here does:
        #
        #   * LWJGL picks the right native classifier out of the uberjar,
        #     unpacks it and dlopens it. A runner with a read-only temp dir
        #     fails here rather than later in something that looks like a mesh
        #     bug (TECHNICAL.md §6.6).
        #   * `Enable-Native-Access` in the manifest still works, so the shipped
        #     jar needs no flag on the command line (issue #6). NOTE that this
        #     only applies to `java -jar`: launching the same jar with `-cp`
        #     ignores the manifest and warns.
        #   * The frontend built into the jar is the one the shell asks for.
        run: |
          set -euo pipefail
          lib="$(mktemp -d)"
          mkdir -p "$lib/Test Bundle/Cruiser/Cube"
          cp test/fixtures/cube-ascii-crlf.stl "$lib/Test Bundle/Cruiser/Cube/unsupported.stl"

          # There is no default library and no SHIPYARD_LIBRARY any more
          # (issue #35). Point the jar at one the way the settings form does,
          # by writing the file it writes - which makes this job a check on
          # that format as well as on the jar.
          cfg="$(mktemp -d)"
          mkdir -p "$cfg/shipyard"
          printf '{:root "%s"}\n' "$lib" > "$cfg/shipyard/library.edn"

          XDG_CONFIG_HOME="$cfg" java -jar target/shipyard-0.1.0-SNAPSHOT.jar > run.log 2>&1 &
          jar_pid=$!
          trap 'kill "$jar_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q 'hx-preserve'
          curl -fsS http://127.0.0.1:8080/library | grep -q 'Cube'

          # A cold part preprocesses in the background, so poll the way the
          # browser does until the mesh URL is issued.
          trigger=""
          for _ in $(seq 1 120); do
            trigger="$(curl -fsSi 'http://127.0.0.1:8080/part/Test%20Bundle/Cruiser/Cube' \
                       | tr -d '\r' | grep -i '^HX-Trigger:' || true)"
            case "$trigger" in *load-mesh*) break ;; esac
            sleep 1
          done
          case "$trigger" in
            *load-mesh*) ;;
            *) echo "::error::the part never became ready"; cat run.log; exit 1 ;;
          esac

          url="$(printf '%s' "$trigger" | grep -o '/mesh/[0-9a-f]\{64\}\.0\.symesh' | head -1)"
          test -n "$url"
          curl -fsSi "http://127.0.0.1:8080$url" | tr -d '\r' \
            | grep -qi 'cache-control: public, max-age=31536000, immutable'

          if grep -qi 'restricted method\|restricted native access' run.log; then
            echo "::error::the jar warned about restricted native access - check the Enable-Native-Access manifest entry"
            cat run.log
            exit 1
          fi
          cat run.log
