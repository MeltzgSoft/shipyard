name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Unit and integration run on both platforms: integration is what exercises
    # LWJGL natives, path separators, file locking and Files.move atomicity,
    # which the mesh cache depends on (TECHNICAL.md §9, §10.2).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            natives: natives-linux
          - os: windows-latest
            natives: natives-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Java 25, not 21: the run and test aliases pass
          # --sun-misc-unsafe-memory-access, which does not exist before JDK 23
          # and makes an older JVM refuse to start.
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Unit tests
        run: clojure -M:test:${{ matrix.natives }} --focus :unit

      - name: Integration tests
        run: clojure -M:test:${{ matrix.natives }} --focus :integration

  build:
    # Proves the release artifact assembles. Linux only: the LWJGL natives are
    # prebuilt jars on Maven Central, so one platform can package all four
    # classifiers (issue #6). Windows CI is for running tests, not building.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build uberjar
        # Runs npm ci, the shadow-cljs :advanced release, the htmx copy, and the
        # uberjar with all four native classifiers.
        run: clojure -T:build uber

      - name: Smoke test the artifact
        run: |
          java -jar target/shipyard-0.1.0-SNAPSHOT.jar &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sfo /dev/null http://127.0.0.1:8080/js/viewport.js
          kill $PID
